openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: roles
    description: Roles and assignments
  - name: grants
    description: Access grants (permissions)
  - name: apps
    description: Applications and resources
  - name: security
    description: Security policies
  - name: audit
    description: Audit log
  - name: sync
    description: Data sync error log
  - name: access
    description: External access-check API and API keys
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /summary:
    get:
      operationId: getSummary
      tags: [audit]
      summary: Dashboard summary counts
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users with their roles
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (name, email, status)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /entra/users:
    get:
      operationId: searchEntraUsers
      tags: [users]
      summary: Search Azure Entra ID directory users by name or email
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        "200":
          description: Matching directory users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntraUser"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Directory lookup failed (e.g. missing Graph permission)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /entra/signins:
    get:
      operationId: listEntraSignIns
      tags: [audit]
      summary: List recent Entra ID sign-in events, optionally filtered by application name
      parameters:
        - name: app
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Recent sign-in events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntraSignIn"
        "502":
          description: Sign-in log lookup failed (e.g. missing Graph permission)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List all roles with user counts
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a new role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleInput"
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          description: Invalid input or duplicate name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /role-assignments/bulk:
    post:
      operationId: bulkCreateRoleAssignments
      tags: [roles]
      summary: Assign one or more roles to one or more users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkRoleAssignmentInput"
      responses:
        "200":
          description: Bulk assignment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkRoleAssignmentResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /role-assignments:
    get:
      operationId: listRoleAssignments
      tags: [roles]
      summary: List user-role assignments
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleAssignment"
    post:
      operationId: createRoleAssignment
      tags: [roles]
      summary: Assign a role to a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleAssignmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignment"
        "400":
          description: Invalid or duplicate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /role-assignments/{id}:
    delete:
      operationId: deleteRoleAssignment
      tags: [roles]
      summary: Remove a role from a user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /access-mapping:
    get:
      operationId: listAccessMapping
      tags: [accessMapping]
      summary: List user-to-app entitlement assignments
      responses:
        "200":
          description: Entitlement assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessMappingEntry"
  /access-mapping/assign:
    post:
      operationId: assignAccessMapping
      tags: [accessMapping]
      summary: Grant or update app access for one or more users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessMappingAssignInput"
      responses:
        "200":
          description: Assignment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessMappingAssignResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /access-mapping/remove:
    post:
      operationId: removeAccessMapping
      tags: [accessMapping]
      summary: Remove app access for one or more users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessMappingRemoveInput"
      responses:
        "200":
          description: Removal result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessMappingRemoveResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /apps:
    get:
      operationId: listApps
      tags: [apps]
      summary: List managed applications
      responses:
        "200":
          description: Apps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/App"
    post:
      operationId: createApp
      tags: [apps]
      summary: Onboard a new application (creates a default security policy)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInput"
      responses:
        "201":
          description: Created app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400":
          description: Invalid input or duplicate name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /apps/{id}:
    patch:
      operationId: updateApp
      tags: [apps]
      summary: Rename an application
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInput"
      responses:
        "200":
          description: Updated app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400":
          description: Invalid input or duplicate name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteApp
      tags: [apps]
      summary: Delete an application and its resources, grants, policy, and API keys
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /apps/{id}/launch:
    patch:
      operationId: updateAppLaunch
      tags: [apps]
      summary: >-
        Set an application's Workspace Shell tile metadata (launch URL, icon,
        description, category). An app with no launchUrl set is never shown
        as a tile, regardless of who has roles for it — see
        docs/workspace/ADDING_NEW_APPS.md.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppLaunchInput"
      responses:
        "200":
          description: Updated app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /my-apps:
    get:
      operationId: getMyApps
      tags: [workspace]
      summary: >-
        Applications the signed-in user is entitled to launch from the
        Workspace Shell (has at least one role assignment for, and which has
        a launchUrl configured). Presentation-only — each application still
        enforces its own access-check independently.
      responses:
        "200":
          description: The signed-in user's launchable apps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAppsResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /resources:
    post:
      operationId: createResource
      tags: [apps]
      summary: Add a resource to an application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceInput"
      responses:
        "201":
          description: Created resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Invalid input or duplicate name within app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    get:
      operationId: listResources
      tags: [apps]
      summary: List resources (forms, tabs, tables), optionally by app
      parameters:
        - name: appId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
  /resources/{id}:
    patch:
      operationId: updateResource
      tags: [apps]
      summary: Update a resource (name, type, description)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceUpdate"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Invalid input or duplicate name within app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteResource
      tags: [apps]
      summary: Remove a resource (revokes its grants)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /permission-matrix/export:
    get:
      operationId: exportPermissionMatrix
      tags: [grants]
      summary: Download the permission-matrix spreadsheet (xlsx) built from live data
      responses:
        "200":
          description: Excel workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
  /access-grants:
    get:
      operationId: listAccessGrants
      tags: [grants]
      summary: List access grants, optionally filtered by app or role
      parameters:
        - name: appId
          in: query
          required: false
          schema: { type: integer }
        - name: roleId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessGrant"
    post:
      operationId: createAccessGrant
      tags: [grants]
      summary: Grant a role access to a resource at a permission level
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessGrantInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessGrant"
        "400":
          description: Invalid or duplicate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /access-grants/{id}:
    patch:
      operationId: updateAccessGrant
      tags: [grants]
      summary: Change the permission level of a grant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessGrantUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessGrant"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteAccessGrant
      tags: [grants]
      summary: Revoke a grant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /security-policies:
    get:
      operationId: listSecurityPolicies
      tags: [security]
      summary: List security policies per app
      responses:
        "200":
          description: Policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityPolicy"
  /security-policies/{id}:
    patch:
      operationId: updateSecurityPolicy
      tags: [security]
      summary: Update an app's security policy
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityPolicyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityPolicy"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /denied-access-summary:
    get:
      operationId: getDeniedAccessSummary
      tags: [audit]
      summary: Count ACCESS_DENIED events in the last 24 h, grouped by actor
      parameters:
        - name: threshold
          in: query
          required: false
          schema: { type: integer, default: 5 }
          description: Minimum denial count that triggers a warning for a key
      responses:
        "200":
          description: Denied access summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeniedAccessSummary"
  /audit-log:
    get:
      operationId: listAuditLog
      tags: [audit]
      summary: List audit log entries, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
        - name: category
          in: query
          required: false
          description: "Filter by entry category: all (default), access (ACCESS_ALLOWED + ACCESS_DENIED only), admin (non-access entries only)"
          schema:
            type: string
            enum: [all, access, admin]
            default: all
        - name: outcome
          in: query
          required: false
          description: "Filter access-check entries by outcome: all (default), allowed, denied"
          schema:
            type: string
            enum: [all, allowed, denied]
            default: all
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
  /sync/error-log:
    get:
      operationId: listSyncErrors
      tags: [sync]
      summary: List current data sync errors, excluding selected entities and connection errors
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100 }
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: entity
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Sync errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncErrorList"
  /sync/entities:
    get:
      operationId: listSyncEntities
      tags: [sync]
      summary: List non-excluded entities that have current sync errors, with unique error counts
      responses:
        "200":
          description: Entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncEntityCount"
  /work-order-purge/search:
    get:
      operationId: searchWorkOrders
      tags: [sync]
      summary: Search D365 F&O production orders in the staging mirror by order number
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Matching work orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkOrderSummary"
  /work-order-purge/preview:
    post:
      operationId: previewWorkOrderPurge
      tags: [sync]
      summary: Dry-run purge — count rows that would be deleted per staging table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkOrderPurgeInput"
      responses:
        "200":
          description: Row counts per table (nothing deleted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrderPurgeResult"
  /work-order-purge/execute:
    post:
      operationId: executeWorkOrderPurge
      tags: [sync]
      summary: Delete all staging rows for the given production orders (single transaction)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkOrderPurgeInput"
      responses:
        "200":
          description: Rows deleted per table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrderPurgeResult"
  /access-check:
    get:
      operationId: checkAccess
      tags: [access]
      summary: Check whether an Entra user may access an app (API-key protected, for external apps)
      parameters:
        - name: entraObjectId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: app
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Access decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCheckResult"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api-keys:
    get:
      operationId: listApiKeys
      tags: [access]
      summary: List API keys (without secrets)
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeySummary"
    post:
      operationId: createApiKey
      tags: [access]
      summary: Create a new API key (secret returned once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyInput"
      responses:
        "201":
          description: Created key including one-time secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [access]
      summary: Revoke an API key
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Revoked
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /users/bulk-delete:
    post:
      operationId: bulkDeleteUsers
      tags: [users]
      summary: Delete multiple users at once (role assignments are removed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteUsersInput"
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteUsersResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /users/bulk-import:
    post:
      operationId: bulkImportUsers
      tags: [users]
      summary: Bulk import users (e.g. from the Entra directory) with optional role assignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportUsersInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportUsersResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
components:
  schemas:
    WorkOrderSummary:
      type: object
      required: [orderNumber, name, itemNumber, status, dataAreaId]
      properties:
        orderNumber: { type: string }
        name: { type: string }
        itemNumber: { type: string }
        status: { type: string }
        scheduledDate: { type: string, nullable: true }
        dataAreaId: { type: string }
    WorkOrderPurgeInput:
      type: object
      required: [orderNumbers]
      properties:
        orderNumbers:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
    WorkOrderPurgeResult:
      type: object
      required: [dryRun, dataAreaId, orderNumbers, counts, totalRows]
      properties:
        dryRun: { type: boolean }
        dataAreaId: { type: string }
        orderNumbers:
          type: array
          items: { type: string }
        counts:
          type: object
          additionalProperties: { type: integer }
        totalRows: { type: integer }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorMessage:
      type: object
      required: [error]
      properties:
        error: { type: string }
    SyncErrorEntry:
      type: object
      required: [id, entitySetName, recordId, operation, errorMessage, createdOn]
      properties:
        id: { type: integer }
        entitySetName: { type: string }
        recordId: { type: string, nullable: true }
        operation: { type: string }
        errorMessage: { type: string }
        createdOn: { type: string, nullable: true }
    SyncEntityCount:
      type: object
      required: [entitySetName, uniqueErrors]
      properties:
        entitySetName: { type: string }
        uniqueErrors: { type: integer }
    SyncErrorList:
      type: object
      required: [entries, totalUnique]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SyncErrorEntry"
        totalUnique: { type: integer }
    PermissionLevel:
      type: string
      enum: ["Full Rights", "Read & Write", "View"]
    Summary:
      type: object
      required: [users, activeUsers, roles, apps, resources, grants, assignments, auditEntries]
      properties:
        users: { type: integer }
        activeUsers: { type: integer }
        roles: { type: integer }
        apps: { type: integer }
        resources: { type: integer }
        grants: { type: integer }
        assignments: { type: integer }
        auditEntries: { type: integer }
    User:
      type: object
      required: [id, name, email, status, roles, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        status: { type: string, enum: [active, disabled] }
        entraObjectId: { type: string, nullable: true }
        roles:
          type: array
          items:
            type: object
            required: [assignmentId, roleId, roleName]
            properties:
              assignmentId: { type: integer }
              roleId: { type: integer }
              roleName: { type: string }
        createdAt: { type: string }
    UserInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, minLength: 3 }
        status: { type: string, enum: [active, disabled] }
        entraObjectId: { type: string }
        roleIds:
          type: array
          items: { type: integer }
    UserUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, minLength: 3 }
        status: { type: string, enum: [active, disabled] }
        entraObjectId: { type: string }
    EntraUser:
      type: object
      required: [objectId, displayName, email, accountEnabled]
      properties:
        objectId: { type: string }
        displayName: { type: string }
        email: { type: string }
        accountEnabled: { type: boolean }
    AccessCheckPermission:
      type: object
      required: [resource, level]
      properties:
        resource: { type: string }
        level: { type: string }
    AccessCheckResult:
      type: object
      required: [allowed, roles, permissions]
      properties:
        allowed: { type: boolean }
        reason: { type: string, nullable: true }
        userName: { type: string, nullable: true }
        status: { type: string, nullable: true }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/AccessCheckPermission"
    ApiKeySummary:
      type: object
      required: [id, appName, label, keyPrefix, createdAt, revoked]
      properties:
        id: { type: integer }
        appName: { type: string }
        label: { type: string }
        keyPrefix: { type: string }
        createdAt: { type: string }
        revoked: { type: boolean }
        lastUsedAt: { type: string, nullable: true }
    CreateApiKeyInput:
      type: object
      required: [appName]
      properties:
        appName: { type: string, minLength: 1 }
        label: { type: string }
    CreatedApiKey:
      type: object
      required: [id, appName, label, keyPrefix, createdAt, key]
      properties:
        id: { type: integer }
        appName: { type: string }
        label: { type: string }
        keyPrefix: { type: string }
        createdAt: { type: string }
        key: { type: string }
    BulkImportUserInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, minLength: 3 }
        entraObjectId: { type: string }
        status: { type: string, enum: [active, disabled] }
    BulkImportUsersInput:
      type: object
      required: [users]
      properties:
        users:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BulkImportUserInput"
        roleIds:
          type: array
          items: { type: integer }
    BulkDeleteUsersInput:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          minItems: 1
          items: { type: integer }
    BulkDeleteUsersResult:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer }
    BulkImportUsersResult:
      type: object
      required: [created, skipped, assignedRoles]
      properties:
        created: { type: integer }
        skipped: { type: integer }
        assignedRoles: { type: integer }
    EntraSignIn:
      type: object
      required: [id, userDisplayName, userPrincipalName, appDisplayName, createdDateTime, success]
      properties:
        id: { type: string }
        userDisplayName: { type: string }
        userPrincipalName: { type: string }
        appDisplayName: { type: string }
        createdDateTime: { type: string }
        success: { type: boolean }
        failureReason: { type: string, nullable: true }
        ipAddress: { type: string, nullable: true }
    Role:
      type: object
      required: [id, name, description, userCount, grantCount, isEntitlement]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        userCount: { type: integer }
        grantCount: { type: integer }
        appId: { type: integer, nullable: true }
        isEntitlement: { type: boolean }
    AccessMappingEntry:
      type: object
      required: [assignmentId, userId, userName, userEmail, appId, appName, level, roleId, roleName, createdAt]
      properties:
        assignmentId: { type: integer }
        userId: { type: integer }
        userName: { type: string }
        userEmail: { type: string }
        appId: { type: integer }
        appName: { type: string }
        level: { type: string, enum: ["Read Only", "Read / Write"] }
        roleId: { type: integer }
        roleName: { type: string }
        createdAt: { type: string }
    AccessMappingAssignInput:
      type: object
      required: [userIds, appIds, level]
      properties:
        userIds:
          type: array
          items: { type: integer }
          minItems: 1
        appIds:
          type: array
          items: { type: integer }
          minItems: 1
        level: { type: string, enum: ["Read Only", "Read / Write"] }
    AccessMappingAssignResult:
      type: object
      required: [assigned, updated, skipped]
      properties:
        assigned: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
    AccessMappingRemoveInput:
      type: object
      required: [userIds, appIds]
      properties:
        userIds:
          type: array
          items: { type: integer }
          minItems: 1
        appIds:
          type: array
          items: { type: integer }
          minItems: 1
    AccessMappingRemoveResult:
      type: object
      required: [removed]
      properties:
        removed: { type: integer }
    CreateRoleInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
    BulkRoleAssignmentInput:
      type: object
      required: [userIds, roleIds]
      properties:
        userIds:
          type: array
          items: { type: integer }
          minItems: 1
        roleIds:
          type: array
          items: { type: integer }
          minItems: 1
    BulkRoleAssignmentResult:
      type: object
      required: [created, skipped]
      properties:
        created: { type: integer }
        skipped: { type: integer }
    RoleAssignment:
      type: object
      required: [id, userId, userName, roleId, roleName, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        userName: { type: string }
        roleId: { type: integer }
        roleName: { type: string }
        createdAt: { type: string }
    RoleAssignmentInput:
      type: object
      required: [userId, roleId]
      properties:
        userId: { type: integer }
        roleId: { type: integer }
    App:
      type: object
      required: [id, name, resourceCount]
      properties:
        id: { type: integer }
        name: { type: string }
        resourceCount: { type: integer }
        launchUrl: { type: string, nullable: true }
        description: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        category: { type: string, nullable: true }
    AppLaunchInput:
      type: object
      properties:
        launchUrl: { type: string, format: uri, nullable: true }
        description: { type: string, maxLength: 500, nullable: true }
        icon: { type: string, maxLength: 100, nullable: true }
        category: { type: string, maxLength: 100, nullable: true }
    MyApp:
      type: object
      required: [id, name, description, icon, category, launchUrl]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        category: { type: string, nullable: true }
        launchUrl: { type: string }
    MyAppsResponse:
      type: object
      required: [userName, apps]
      properties:
        userName: { type: string }
        apps:
          type: array
          items: { $ref: "#/components/schemas/MyApp" }
    AppInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    ResourceInput:
      type: object
      required: [appId, name, type]
      properties:
        appId: { type: integer }
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [Form, Tab, Table] }
        description: { type: string }
    ResourceUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [Form, Tab, Table] }
        description: { type: string }
    Resource:
      type: object
      required: [id, appId, appName, name, type, description]
      properties:
        id: { type: integer }
        appId: { type: integer }
        appName: { type: string }
        name: { type: string }
        type: { type: string, enum: [Form, Tab, Table] }
        description: { type: string }
    AccessGrant:
      type: object
      required: [id, roleId, roleName, resourceId, resourceName, resourceType, appId, appName, level]
      properties:
        id: { type: integer }
        roleId: { type: integer }
        roleName: { type: string }
        resourceId: { type: integer }
        resourceName: { type: string }
        resourceType: { type: string }
        appId: { type: integer }
        appName: { type: string }
        level:
          $ref: "#/components/schemas/PermissionLevel"
    AccessGrantInput:
      type: object
      required: [roleId, resourceId, level]
      properties:
        roleId: { type: integer }
        resourceId: { type: integer }
        level:
          $ref: "#/components/schemas/PermissionLevel"
    AccessGrantUpdate:
      type: object
      required: [level]
      properties:
        level:
          $ref: "#/components/schemas/PermissionLevel"
    SecurityPolicy:
      type: object
      required: [id, appId, appName, authMethod, mfaRequired, sessionTimeoutMinutes, recordLevelScope, fieldLevelRules, auditLogging, dataExportPolicy]
      properties:
        id: { type: integer }
        appId: { type: integer }
        appName: { type: string }
        authMethod: { type: string }
        mfaRequired: { type: string }
        sessionTimeoutMinutes: { type: integer }
        recordLevelScope: { type: string }
        fieldLevelRules: { type: string }
        auditLogging: { type: boolean }
        dataExportPolicy: { type: string }
    SecurityPolicyUpdate:
      type: object
      properties:
        authMethod: { type: string }
        mfaRequired: { type: string }
        sessionTimeoutMinutes: { type: integer }
        recordLevelScope: { type: string }
        fieldLevelRules: { type: string }
        auditLogging: { type: boolean }
        dataExportPolicy: { type: string }
    DeniedAccessHotKey:
      type: object
      required: [actor, count]
      properties:
        actor: { type: string }
        count: { type: integer }
    DeniedAccessTopEntity:
      type: object
      required: [entity, count]
      properties:
        entity: { type: string }
        count: { type: integer }
        displayName: { type: string, nullable: true, description: "Resolved display name when the entity is a known user's entraObjectId; null otherwise" }
    DeniedAccessSummary:
      type: object
      required: [total24h, threshold, hotKeys, topEntities]
      properties:
        total24h: { type: integer }
        threshold: { type: integer }
        hotKeys:
          type: array
          items:
            $ref: "#/components/schemas/DeniedAccessHotKey"
        topEntities:
          type: array
          description: >
            Top denied entity values from the audit_log entity column in the last 24 h.
            Only entities with a denial count >= threshold are included, matching the
            same minimum threshold applied to hotKeys. Entities below the threshold
            are excluded server-side to reduce false-alarm noise.
          items:
            $ref: "#/components/schemas/DeniedAccessTopEntity"
    AuditEntry:
      type: object
      required: [id, action, entity, detail, actor, createdAt]
      properties:
        id: { type: integer }
        action: { type: string }
        entity: { type: string }
        detail: { type: string }
        actor: { type: string }
        createdAt: { type: string }
