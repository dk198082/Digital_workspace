name: AdminConsole Production

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: AdminConsole
  REGISTRY: adminconsoleprod.azurecr.io
  IMAGE_NAME: adminconsole

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name adminconsoleprod

      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} \
            -t $REGISTRY/$IMAGE_NAME:latest \
            .

      - name: Inspect frontend files
        run: |
          docker run --rm $REGISTRY/$IMAGE_NAME:${{ github.sha }} \
            sh -c '
              echo "=== ENVIRONMENT ==="
              echo "NODE_ENV=$NODE_ENV"
              echo "PORT=$PORT"
              echo "STATIC_ROOT_DIR=$STATIC_ROOT_DIR"

              echo "=== STATIC ROOT ==="
              ls -la /repo/static-root || true

              echo "=== ADMIN CONSOLE ==="
              ls -la /repo/static-root/admin-console || true

              echo "=== ADMIN FILES ==="
              find /repo/static-root/admin-console -maxdepth 2 -type f | head -30 || true

              echo "=== WORKSPACE SHELL ==="
              ls -la /repo/static-root/workspace-shell || true

              echo "=== WORKSPACE FILES ==="
              find /repo/static-root/workspace-shell -maxdepth 2 -type f | head -30 || true
            '

      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_NAME:latest

      - name: Deploy container to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Azure Logout
        run: |
          az logout