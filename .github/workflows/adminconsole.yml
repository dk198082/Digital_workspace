name: AdminConsole Production

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: AdminConsole
  REGISTRY: adminconsoleprod.azurecr.io
  IMAGE_NAME: adminconsole

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name adminconsoleprod

      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} \
            -t $REGISTRY/$IMAGE_NAME:latest \
            .

      # ---------------------------------------------------------------
      # DIAGNOSTIC: Inspect the newly built image
      # ---------------------------------------------------------------
      - name: Inspect current image
        run: |
          echo "========================================"
          echo "CURRENT IMAGE"
          echo "========================================"

          docker run --rm $REGISTRY/$IMAGE_NAME:${{ github.sha }} \
            sh -c '
              echo "=== ENVIRONMENT ==="
              echo "NODE_ENV=$NODE_ENV"
              echo "PORT=$PORT"
              echo "STATIC_DIR=$STATIC_DIR"
              echo "STATIC_ROOT_DIR=$STATIC_ROOT_DIR"

              echo "=== STATIC ROOT ==="
              ls -la /repo/static-root || true

              echo "=== ADMIN CONSOLE ==="
              ls -la /repo/static-root/admin-console || true

              echo "=== ADMIN INDEX ==="
              cat /repo/static-root/admin-console/index.html || true

              echo "=== WORKSPACE ==="
              ls -la /repo/static-root/workspace-shell || true

              echo "=== ROOT ==="
              ls -la /repo || true
            '

      # ---------------------------------------------------------------
      # DIAGNOSTIC: Inspect the original working 11 Sep image
      # ---------------------------------------------------------------
      - name: Inspect original 11 Sep image
        run: |
          echo "========================================"
          echo "ORIGINAL 11 SEP IMAGE"
          echo "========================================"

          docker pull \
            $REGISTRY/$IMAGE_NAME:e397ac0d8a0823e2bfc4d095e9e0628de1e4f344

          docker run --rm \
            $REGISTRY/$IMAGE_NAME:e397ac0d8a0823e2bfc4d095e9e0628de1e4f344 \
            sh -c '
              echo "=== ENVIRONMENT ==="
              echo "NODE_ENV=$NODE_ENV"
              echo "PORT=$PORT"
              echo "STATIC_DIR=$STATIC_DIR"
              echo "STATIC_ROOT_DIR=$STATIC_ROOT_DIR"

              echo "=== STATIC ROOT ==="
              ls -la /repo/static-root || true

              echo "=== ADMIN CONSOLE ==="
              ls -la /repo/static-root/admin-console || true

              echo "=== ADMIN INDEX ==="
              cat /repo/static-root/admin-console/index.html || true

              echo "=== WORKSPACE ==="
              ls -la /repo/static-root/workspace-shell || true

              echo "=== ROOT ==="
              ls -la /repo || true
            '

      # ---------------------------------------------------------------
      # Push the newly built image
      # ---------------------------------------------------------------
      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_NAME:latest

      # ---------------------------------------------------------------
      # Deploy the newly built image to Azure App Service
      # ---------------------------------------------------------------
      - name: Deploy container to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Azure Logout
        run: |
          az logout