name: Digitalworkspace Production

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: Digitalworkspace
  RESOURCE_GROUP: TOAXRGP
  REGISTRY: digitalworkspaceprod.azurecr.io
  ACR_NAME: Digitalworkspaceprod
  IMAGE_NAME: digitalworkspace

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name $ACR_NAME

      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} \
            -t $REGISTRY/$IMAGE_NAME:latest \
            .

      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_NAME:latest

      - name: Configure Web App Container
        run: |
          az webapp config container set \
            --resource-group $RESOURCE_GROUP \
            --name $AZURE_WEBAPP_NAME \
            --container-image-name $REGISTRY/$IMAGE_NAME:latest \
            --container-registry-url https://$REGISTRY

      - name: Restart Web App
        run: |
          az webapp restart \
            --resource-group $RESOURCE_GROUP \
            --name $AZURE_WEBAPP_NAME